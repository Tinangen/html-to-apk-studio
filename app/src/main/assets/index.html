<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML to APK Studio PRO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #0b1020;
  color: #f5f7ff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
}

h1 {
  font-size: 27px;
  margin-bottom: 5px;
}

.subtitle {
  color: #9da9c5;
  margin-bottom: 25px;
}

.card {
  background: #151d32;
  border: 1px solid #273451;
  border-radius: 17px;
  padding: 18px;
  margin-bottom: 17px;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-size: 14px;
  color: #bdc9e4;
}

input, textarea {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #354361;
  background: #0c1427;
  color: white;
  font-size: 15px;
  outline: none;
}

textarea {
  min-height: 180px;
  resize: vertical;
  font-family: monospace;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 13px;
  border: 0;
  border-radius: 11px;
  background: #637cff;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

.secondary {
  background: #273653;
}

#status {
  margin-top: 15px;
  padding: 13px;
  border-radius: 10px;
  background: #0c1427;
  color: #bdc9e4;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

small {
  color: #9da9c5;
  line-height: 1.5;
}

iframe {
  width: 100%;
  height: 300px;
  background: white;
  border: 0;
  border-radius: 10px;
  margin-top: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>HTML to APK Studio PRO</h1>
<div class="subtitle">Превращай HTML-сайты в Android-приложения.</div>

<div class="card">

<h3>📱 Настройки приложения</h3>

<label>Название приложения</label>
<input id="appName" value="My HTML App" maxlength="40">

<label>Package ID</label>
<input id="packageId" value="com.example.myhtmlapp">

</div>

<div class="card">

<h3>📄 HTML-файл</h3>

<label>Выбери HTML на устройстве</label>
<input id="htmlFile" type="file" accept=".html,.htm,text/html">

<div id="fileStatus">Файл пока не выбран.</div>

<label>Или вставь HTML-код</label>
<textarea id="htmlCode" placeholder="Вставь сюда HTML-код..."></textarea>

<button class="secondary" onclick="previewHTML()">
Предпросмотр
</button>

<iframe id="preview" sandbox="allow-scripts allow-forms"></iframe>

</div>

<div class="card">

<h3>🔐 Подключение сборщика</h3>

<label>Ключ доступа Worker</label>
<input
  id="uploadKey"
  type="password"
  autocomplete="off"
  placeholder="Введи свой UPLOAD_KEY"
>

<small>
Ключ используется только для отправки запроса.
Он не сохраняется в приложении.
Никому его не передавай.
</small>

</div>

<div class="card">

<h3>🚀 Сборка APK</h3>

<button id="buildButton" onclick="buildAPK()">
Собрать APK
</button>

<div id="status">Ожидание сборки...</div>

</div>

</div>

<script>

const WORKER_URL =
"https://html-to-apk-builder.tyyyym67.workers.dev/";

let loadedHTML = "";

const htmlFile = document.getElementById("htmlFile");

htmlFile.addEventListener("change", async function() {

  const file = this.files[0];

  if (!file) return;

  if (!file.name.toLowerCase().endsWith(".html") &&
      !file.name.toLowerCase().endsWith(".htm")) {
    alert("Выбери HTML-файл.");
    return;
  }

  if (file.size > 500000) {
    alert("Максимальный размер HTML — 500 КБ.");
    return;
  }

  document.getElementById("fileStatus").textContent =
    "Загружаю файл...";

  try {
    loadedHTML = await file.text();

    document.getElementById("fileStatus").textContent =
      "Файл загружен: " + file.name;

    document.getElementById("htmlCode").value = "";

  } catch (error) {
    document.getElementById("fileStatus").textContent =
      "Не удалось прочитать файл.";

  }

});

function getHTML() {

  const textarea = document.getElementById("htmlCode").value;

  if (textarea.trim()) {
    return textarea;
  }

  return loadedHTML;
}

function previewHTML() {

  const html = getHTML();

  if (!html.trim()) {
    alert("Сначала выбери HTML-файл или вставь код.");
    return;
  }

  document.getElementById("preview").srcdoc = html;

}

async function buildAPK() {

  const button = document.getElementById("buildButton");
  const status = document.getElementById("status");

  const html = getHTML();

  const appName =
    document.getElementById("appName").value.trim();

  const packageId =
    document.getElementById("packageId").value.trim();

  const uploadKey =
    document.getElementById("uploadKey").value;

  if (!html.trim()) {
    alert("Сначала загрузи HTML.");
    return;
  }

  if (!appName) {
    alert("Введи название приложения.");
    return;
  }

  if (!uploadKey) {
    alert("Введи ключ доступа Worker.");
    return;
  }

  if (!/^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$/.test(packageId)) {
    alert("Неверный Package ID.");
    return;
  }

  button.disabled = true;
  button.textContent = "Отправка...";

  status.textContent =
    "Отправляем HTML в систему сборки...\nПожалуйста, подожди.";

  try {

    const response = await fetch(WORKER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "X-Upload-Key": uploadKey
      },

      body: JSON.stringify({
        html: html,
        appName: appName,
        packageId: packageId
      })

    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || "Ошибка отправки"
      );
    }

    status.textContent =
      "✅ HTML успешно отправлен!\n\n" +
      "GitHub Actions получил команду на сборку.\n\n" +
      "Открой GitHub → Actions, чтобы следить за процессом.\n\n" +
      "После завершения скачай APK из раздела Artifacts.";

  } catch (error) {

    status.textContent =
      "❌ Ошибка:\n" + error.message;

  } finally {

    button.disabled = false;
    button.textContent = "Собрать APK";

  }

}

</script>

</body>
</html>
