name: Build User HTML APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: true
        type: string
        default: "My HTML App"

      package_id:
        description: "Android package ID"
        required: true
        type: string
        default: "com.example.myhtmlapp"

permissions:
  contents: read

jobs:
  build:
    name: Build APK from HTML
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check uploaded HTML
        run: |
          if [ ! -f app/src/main/assets/user-app.html ]; then
            echo "HTML file was not uploaded!"
            exit 1
          fi

      - name: Prepare application
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          app_name = os.environ["APP_NAME"]
          package_id = os.environ["PACKAGE_ID"]

          if not re.fullmatch(
              r"[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+",
              package_id
          ):
              raise SystemExit("Invalid package ID")

          assets = Path("app/src/main/assets")
          assets.mkdir(parents=True, exist_ok=True)

          source = assets / "user-app.html"
          target = assets / "index.html"

          target.write_bytes(source.read_bytes())

          gradle = Path("app/build.gradle")
          text = gradle.read_text()

          text = re.sub(
              r"applicationId\s+['\"][^'\"]+['\"]",
              "applicationId '" + package_id + "'",
              text,
              count=1
          )

          gradle.write_text(text)

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="' + app_name.replace('"', '') + '"',
              text,
              count=1
          )

          manifest.write_text(text)

          print("Application prepared successfully")
          PY

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: User-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
